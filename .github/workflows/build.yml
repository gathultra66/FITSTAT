name: Compilar FITSTAT

# Compila la app y corre las pruebas en los servidores de GitHub (que ya traen el SDK de Android).
# Se ejecuta al subir cambios a main o a v1.9.2, y a mano desde la pestaña Actions.
on:
  push:
    branches: [main, v1.9.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app (debug)
        id: assemble
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log

      - name: Pruebas unitarias
        id: tests
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --console=plain --continue :app:testDebugUnitTest 2>&1 | tee test.log

      # Deja los errores, el final del registro y el conteo de pruebas como anotaciones (se leen sin iniciar sesión).
      - name: Resumen de resultados
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def interesting(lines):
              out = []
              for i, l in enumerate(lines):
                  if l.startswith('e: ') or 'FAILURE:' in l:
                      out.append(l)
                  elif 'What went wrong' in l:
                      out.extend(lines[i:i + 5])
                  elif l.rstrip().endswith('FAILED'):
                      out.extend(lines[i:i + 4])
              return out

          for name in ('build.log', 'test.log'):
              if not os.path.exists(name):
                  continue
              with open(name, errors='replace') as f:
                  lines = f.read().splitlines()
              errs = interesting(lines)
              if errs:
                  print('::error title=%s errores::%s' % (name, esc('\n'.join(errs)[:3500])))
              print('::notice title=%s final del registro::%s' % (name, esc('\n'.join(lines[-30:])[-3500:])))

          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'))
          if files:
              total = fails = errors = skipped = 0
              per_class = []
              failed = []
              for p in files:
                  root = ET.parse(p).getroot()
                  t, f, e, s = (int(root.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
                  total += t
                  fails += f
                  errors += e
                  skipped += s
                  per_class.append('%s=%d' % (root.get('name', os.path.basename(p)).split('.')[-1], t))
                  for tc in root.iter('testcase'):
                      for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                          failed.append('%s.%s: %s' % (tc.get('classname', '').split('.')[-1], tc.get('name'), (bad.get('message') or '')[:200]))
              head = 'Pruebas: %d en %d clases, %d fallos, %d errores, %d omitidas' % (total, len(files), fails, errors, skipped)
              body = head + '\n' + ', '.join(per_class)
              print('::notice title=Resultado de las pruebas::%s' % esc(body[:3500]))
              if failed:
                  print('::error title=Pruebas que fallaron::%s' % esc('\n'.join(failed)[:3500]))
          else:
              print('::warning title=Resultado de las pruebas::No se encontraron reportes XML de pruebas')
          PY

      - name: Guardar el APK de prueba
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitstat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Guardar reportes de pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
