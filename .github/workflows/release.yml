name: APK firmado (release)

# Compila el APK de release firmado con la llave de FITSTAT. La llave y su contraseña vienen de los secretos del repo
# (Settings › Secrets and variables › Actions), nunca del código.
#   FITSTAT_KEYSTORE_BASE64  → fitstat.keystore en base64
#   FITSTAT_KEY_PASSWORD     → contraseña de la llave (la misma que usa app/build.gradle.kts)
on:
  workflow_dispatch:
  push:
    branches: [v1.9.2]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FITSTAT_KEYSTORE_BASE64: ${{ secrets.FITSTAT_KEYSTORE_BASE64 }}
      FITSTAT_KEY_PASSWORD: ${{ secrets.FITSTAT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que existan los secretos
        run: |
          if [ -z "$FITSTAT_KEYSTORE_BASE64" ]; then
            echo "::error title=Falta un secreto::FITSTAT_KEYSTORE_BASE64 no está configurado en el repo."; exit 1
          fi
          if [ -z "$FITSTAT_KEY_PASSWORD" ]; then
            echo "::error title=Falta un secreto::FITSTAT_KEY_PASSWORD no está configurado en el repo."; exit 1
          fi

      - name: Preparar la llave (queda solo durante este trabajo)
        run: |
          printf '%s' "$FITSTAT_KEYSTORE_BASE64" | base64 -d > fitstat.keystore
          test -s fitstat.keystore || { echo "::error title=Llave inválida::El secreto FITSTAT_KEYSTORE_BASE64 no se pudo decodificar."; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK firmado
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease 2>&1 | tee build.log

      - name: Resumen de errores de compilación
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          lines = open('build.log', errors='replace').read().splitlines()
          out = []
          for i, l in enumerate(lines):
              if l.startswith('e: ') or 'FAILURE:' in l:
                  out.append(l)
              elif 'What went wrong' in l:
                  out.extend(lines[i:i + 6])
          print('::error title=Error al compilar el release::%s' % esc('\n'.join(out or lines[-40:])[:3500]))
          PY

      - name: Verificar la firma y mostrar la huella de la llave
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error title=Sin APK::No se generó el APK de release."; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          # Compara esta huella (SHA-256) con la de tu llave original: si coincide, la firma es la correcta.
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256' | sed 's/^/Huella de la llave: /'

      - name: Quitar la llave del disco
        if: ${{ always() }}
        run: rm -f fitstat.keystore

      - name: Guardar el APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: fitstat-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
